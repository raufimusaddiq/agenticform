name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agenticform_migration_test
          POSTGRES_USER: agenticform
          POSTGRES_PASSWORD: agenticform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenticform -d agenticform_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/agenticform_migration_test
      MIGRATION_TEST_DATABASE_USER: agenticform
      MIGRATION_TEST_DATABASE_PASSWORD: agenticform
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test server and Flyway migrations
        run: mvn -B test

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: node/go.mod
      - name: Vet node daemon
        run: go vet ./...
      - name: Test node daemon
        run: go test ./...
      - name: Build node daemon
        run: go build ./cmd/agenticform-node
      - name: Build node container
        run: docker build -f Dockerfile ..

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web
        run: npm run build
