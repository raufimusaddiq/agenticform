name: Release execution node image

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - ".github/workflows/release-node-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push execution node
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node/Dockerfile
          push: true
          tags: ghcr.io/raufimusaddiq/agenticform-node:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish immutable image reference
        run: |
          echo "### Execution node image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/raufimusaddiq/agenticform-node@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Set AGENTICFORM_NODE_IMAGE to the digest-qualified reference above." >> "$GITHUB_STEP_SUMMARY"
