name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Main commit SHA to build and deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      server_image: ${{ steps.refs.outputs.server_image }}
      web_image: ${{ steps.refs.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify release is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/raufimusaddiq/agenticform-server:sha-${{ inputs.sha }}
          labels: org.opencontainers.image.revision=${{ inputs.sha }}
      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/raufimusaddiq/agenticform-web:sha-${{ inputs.sha }}
          labels: org.opencontainers.image.revision=${{ inputs.sha }}
      - name: Export immutable image references
        id: refs
        run: |
          echo "server_image=ghcr.io/raufimusaddiq/agenticform-server@${{ steps.server.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/raufimusaddiq/agenticform-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable images
        env:
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          SERVER_IMAGE: ${{ needs.build.outputs.server_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /root/agenticform && \
             AGENTICFORM_SERVER_IMAGE='$SERVER_IMAGE' AGENTICFORM_WEB_IMAGE='$WEB_IMAGE' \
             AGENTICFORM_VERSION='sha-${{ inputs.sha }}' \
             docker compose --project-name agenticform-alpha \
               -f docker-compose.prod.yml -f docker-compose.traefik.yml \
               --env-file .env.upgrade pull server web && \
             AGENTICFORM_SERVER_IMAGE='$SERVER_IMAGE' AGENTICFORM_WEB_IMAGE='$WEB_IMAGE' \
             AGENTICFORM_VERSION='sha-${{ inputs.sha }}' \
             docker compose --project-name agenticform-alpha \
               -f docker-compose.prod.yml -f docker-compose.traefik.yml \
               --env-file .env.upgrade up -d --no-build server web"
