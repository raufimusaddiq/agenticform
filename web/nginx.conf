server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location ~ ^/api/(events|agents)/stream$ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ { proxy_pass http://server:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /actuator/ { proxy_pass http://server:8080; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
