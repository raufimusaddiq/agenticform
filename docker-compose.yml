services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenticform
      POSTGRES_USER: agenticform
      POSTGRES_PASSWORD: agenticform
    ports:
      - "5432:5432"
    volumes:
      - agenticform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticform -d agenticform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agenticform-postgres:
