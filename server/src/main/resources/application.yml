server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agenticform}
    username: ${DATABASE_USER:agenticform}
    password: ${DATABASE_PASSWORD:agenticform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: Agenticform
    version: ${AGENTICFORM_VERSION:development}
    edition: Self-Hosted Alpha

agenticform:
  public-url: ${AGENTICFORM_PUBLIC_URL:http://localhost:8080}
  security:
    admin-token: ${AGENTICFORM_ADMIN_TOKEN:}
    secret-key: ${AGENTICFORM_SECRET_KEY:}
  project-roots:
    - ${AGENTICFORM_PROJECT_ROOT:/srv/apps}
  project-discovery:
    max-depth: ${AGENTICFORM_PROJECT_DISCOVERY_MAX_DEPTH:3}
    max-candidates: ${AGENTICFORM_PROJECT_DISCOVERY_MAX_CANDIDATES:200}
  workspace:
    root: ${AGENTICFORM_WORKTREE_ROOT:/srv/agenticform/worktrees}
    git-timeout: ${AGENTICFORM_GIT_TIMEOUT:30s}
    cleanup-retention: ${AGENTICFORM_WORKTREE_RETENTION:24h}
    cleanup-delay-ms: ${AGENTICFORM_WORKTREE_CLEANUP_DELAY_MS:3600000}
  codex:
    endpoint: ${CODEX_APP_SERVER_URL:ws://127.0.0.1:4500}
    request-timeout: ${CODEX_REQUEST_TIMEOUT:30s}
    experimental-api: ${CODEX_EXPERIMENTAL_API:true}
  github:
    api-url: ${AGENTICFORM_GITHUB_API_URL:https://api.github.com}
    token: ${AGENTICFORM_GITHUB_TOKEN:}
    webhook-secret: ${AGENTICFORM_GITHUB_WEBHOOK_SECRET:}
    poll-interval: ${AGENTICFORM_GITHUB_POLL_INTERVAL:3s}
    reconcile-delay-ms: ${AGENTICFORM_GITHUB_RECONCILE_DELAY_MS:30000}
    app-id: ${AGENTICFORM_GITHUB_APP_ID:0}
    installation-id: ${AGENTICFORM_GITHUB_INSTALLATION_ID:0}
    app-private-key-path: ${AGENTICFORM_GITHUB_APP_PRIVATE_KEY_PATH:}
  node:
    enrollment-ttl: ${AGENTICFORM_NODE_ENROLLMENT_TTL:10m}
    offline-after: ${AGENTICFORM_NODE_OFFLINE_AFTER:45s}
    command-lease: ${AGENTICFORM_NODE_COMMAND_LEASE:15m}
    request-nonce-ttl: ${AGENTICFORM_NODE_REQUEST_NONCE_TTL:10m}
    max-clock-skew: ${AGENTICFORM_NODE_MAX_CLOCK_SKEW:2m}
    recovery-grace: ${AGENTICFORM_NODE_RECOVERY_GRACE:2m}
    auto-recovery-enabled: ${AGENTICFORM_NODE_AUTO_RECOVERY:true}
    recovery-delay-ms: ${AGENTICFORM_NODE_RECOVERY_DELAY_MS:30000}
    image: ${AGENTICFORM_NODE_IMAGE:ghcr.io/raufimusaddiq/agenticform-node:latest}
  ui:
    origin: ${AGENTICFORM_UI_ORIGIN:http://localhost:5173}
  scheduler:
    dispatch-delay-ms: ${AGENTICFORM_DISPATCH_DELAY_MS:2000}
    reconcile-delay-ms: ${AGENTICFORM_RECONCILE_DELAY_MS:10000}
    operation-run-delay-ms: ${AGENTICFORM_OPERATION_RUN_DELAY_MS:1000}
    operation-event-delay-ms: ${AGENTICFORM_OPERATION_EVENT_DELAY_MS:2000}
