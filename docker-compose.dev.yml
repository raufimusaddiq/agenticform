services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenticform}
      POSTGRES_USER: ${POSTGRES_USER:-agenticform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenticform}
    ports:
      - "127.0.0.1:${AGENTICFORM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - development-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  development-postgres:
